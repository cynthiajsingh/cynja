[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# Baseline security headers for static files. Server-rendered pages set their
# own (including CSP and noindex for admin routes) in src/middleware.ts.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Only this site may frame its pages. Expressed as CSP rather than X-Frame-Options so
    # it combines cleanly with the stricter frame-ancestors 'none' the admin pages send.
    Content-Security-Policy = "frame-ancestors 'self'"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/blog"
  to = "/blogs"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/blogs/:splat"
  status = 301
